# Collector connects to the same Timescale as smoke (external network) OR
# run with: docker compose -f ../smoke/docker-compose.yml -f docker-compose.yml up -d

services:
  collector:
    build:
      context: ../..
      dockerfile: deploy/platform/Dockerfile
    container_name: level2-collector
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-level2}:${POSTGRES_PASSWORD:-level2_change_me}@timescaledb:5432/${POSTGRES_DB:-level2}?sslmode=disable
      PLC_OPC_ENDPOINT: ${PLC_OPC_ENDPOINT:-opc.tcp://10.14.10.16:4840}
      OPC_UA_USERNAME: ${OPC_UA_USERNAME:-}
      OPC_UA_PASSWORD: ${OPC_UA_PASSWORD:-}
    volumes:
      - ./config.yaml:/etc/level2/config.yaml:ro
    ports:
      - "8080:8080"
    command: ["/collector", "-config", "/etc/level2/config.yaml"]
    networks:
      - smoke_default

networks:
  smoke_default:
    external: true
    name: smoke_default
