# Collector connects to the same Timescale as smoke (external network).

services:
  collector:
    build:
      context: ../..
      dockerfile: deploy/platform/Dockerfile
    container_name: level2-collector
    restart: unless-stopped
    user: "1000:1000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-level2}:${POSTGRES_PASSWORD:-level2_change_me}@timescaledb:5432/${POSTGRES_DB:-level2}?sslmode=disable
      PLC_OPC_ENDPOINT: ${PLC_OPC_ENDPOINT:-opc.tcp://10.14.10.16:4840}
      OPC_UA_USERNAME: ${OPC_UA_USERNAME:-}
      OPC_UA_PASSWORD: ${OPC_UA_PASSWORD:-}
      LEVEL2_SIM_BROWSER: ${LEVEL2_SIM_BROWSER:-1}
      LEVEL2_OPC_WRITE_ENABLED: ${LEVEL2_OPC_WRITE_ENABLED:-false}
      SPOOL_DIR: /var/lib/level2/spool
      UI_DIR: /usr/share/level2/ui
      # Same Docker volume as smoke Timescale (/var/lib/postgresql/data) so Statfs
      # disk_total + disk_avail match the real PG data filesystem (not an empty mount).
      LEVEL2_DB_DATA_PATH: ${LEVEL2_DB_DATA_PATH:-/var/lib/level2/dbdisk}
    volumes:
      # whole dir so Excel import can rewrite config.yaml (+ .tmp)
      - ./:/etc/level2/cfg
      - collector_spool:/var/lib/level2/spool
      # MUST be smoke_timeseries (same as timescaledb service) — not a separate empty volume
      - smoke_timeseries:/var/lib/level2/dbdisk:ro
    ports:
      - "8080:8080"
    command: ["-config", "/etc/level2/cfg/config.yaml"]
    networks:
      - smoke_default

volumes:
  collector_spool:
  # Created by deploy/smoke (project name "smoke" → smoke_timeseries)
  smoke_timeseries:
    external: true
    name: smoke_timeseries

networks:
  smoke_default:
    external: true
    name: smoke_default
