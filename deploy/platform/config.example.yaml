# Level2 collector (M2+) — OPC UA leaf tags → TimescaleDB + API/UI
#
# Secrets via env: DATABASE_URL, PLC_OPC_ENDPOINT, OPC_UA_USERNAME, OPC_UA_PASSWORD
# PLC-off browse/expand: LEVEL2_SIM_BROWSER=1

listen: ":8080"
spool_dir: "/var/lib/level2/spool"
ui_dir: "/usr/share/level2/ui"

database:
  url: "postgres://level2:level2_change_me@timescaledb:5432/level2?sslmode=disable"

devices:
  - id: s7_1500
    endpoint: "opc.tcp://10.14.10.16:4840"
    username: ""
    password: ""
    security: "None"
    tags:
      - id: opc_measure_rvalue
        node_id: "ns=4;i=4208"
        datatype: float64
        enabled: true
        interval_ms: 1000
      # Example second tag for multi-tag poll (PLC-off harmless if node missing)
      # - id: opc_measure_unit
      #   node_id: "ns=4;i=4209"
      #   datatype: string
      #   enabled: false
      #   interval_ms: 2000
