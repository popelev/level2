# Level2 collector (M2+) — OPC UA leaf tags → TimescaleDB + API/UI
#
# Secrets via env: DATABASE_URL, PLC_OPC_ENDPOINT, OPC_UA_USERNAME, OPC_UA_PASSWORD
# PLC-off browse/expand: LEVEL2_SIM_BROWSER=1
# Opt-in tag samples only (default false; NEVER auto on disconnect): tag_simulation / LEVEL2_TAG_SIMULATION
# PLC write API: opc_write_enabled / LEVEL2_OPC_WRITE_ENABLED (default false)
# Optional API token: api_token / LEVEL2_API_TOKEN (empty = auth disabled; prefer env)

listen: ":8080"
spool_dir: "/var/lib/level2/spool"
ui_dir: "/usr/share/level2/ui"
opc_write_enabled: false
tag_simulation: false
# api_token: ""   # prefer LEVEL2_API_TOKEN env; rewritten config strips this field

database:
  url: "postgres://level2:level2_change_me@timescaledb:5432/level2?sslmode=disable"
  # Max fraction of disk the DB may use (1–100). Byte limit = disk_total × percent / 100.
  # Override absolute bytes with env LEVEL2_DB_CAPACITY_BYTES if needed.
  capacity_percent: 90
  # When used >= limit: stop | drop_oldest | rotate (Phase 2 stub) | expand_limit
  full_policy: stop

devices:
  - id: s7_1500
    endpoint: "opc.tcp://10.14.10.16:4840"
    username: ""
    password: ""
    security: "None"
    # Parallel OPC Read batches (1-16; default 4). Helps large tag sets approach interval_ms.
    poll_concurrency: 4
    tags:
      - id: opc_measure_rvalue
        node_id: "ns=4;i=4208"
        datatype: float64
        enabled: true
        interval_ms: 1000
        # writable: false   # default; set true to allow Write API
      # Example second tag for multi-tag poll (PLC-off harmless if node missing)
      # - id: opc_measure_unit
      #   node_id: "ns=4;i=4209"
      #   datatype: string
      #   enabled: false
      #   interval_ms: 2000
