# Jenkins LTS next to the Level2 lab stack (same Docker host).
# Does not modify deploy/smoke or deploy/platform networks.
#
# UI: http://<host>:8081/  (collector already uses 8080)

services:
  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    image: level2-jenkins:local
    container_name: level2-jenkins
    restart: unless-stopped
    user: root
    ports:
      - "8081:8080"
      - "50000:50000"
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=true"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Sibling builds: run golang/node/docker build on the host engine
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: mount the repo when developing the Jenkinsfile locally
      # - ../..:/workspace/level2:ro
    # Keep Jenkins on the default bridge; no need to join smoke_default

volumes:
  jenkins_home:
