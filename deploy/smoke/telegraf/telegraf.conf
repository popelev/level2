# Telegraf smoke: OPC UA (S7-1500) → PostgreSQL/TimescaleDB
#
# 1. Задайте PLC_OPC_ENDPOINT в .env
# 2. Замените nodes ниже на реальные NodeId из UaExpert
# 3. docker compose up -d

[agent]
  interval = "1s"
  round_interval = true
  metric_batch_size = "1000"
  metric_buffer_limit = "10000"
  collection_jitter = "0s"
  flush_interval = "1s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "level2-smoke"
  omit_hostname = false

###############################################################################
#                            INPUT: OPC UA                                    #
###############################################################################

[[inputs.opcua]]
  name = "opcua"
  endpoint = "${PLC_OPC_ENDPOINT}"
  connect_timeout = "10s"
  request_timeout = "5s"
  session_timeout = "20m"
  ## Как в UaExpert: Basic256Sha256 + Sign & Encrypt
  security_policy = "Basic256Sha256"
  security_mode = "SignAndEncrypt"
  ## Клиентский сертификат (Telegraf создаст сам при первом старте, если файлов нет)
  certificate = "/etc/telegraf/opcua/cert.pem"
  private_key = "/etc/telegraf/opcua/key.pem"
  ## Как в UaExpert: User Name + Password (не Anonymous)
  auth_method = "UserName"
  username = "${OPC_UA_USERNAME}"
  password = "${OPC_UA_PASSWORD}"
  timestamp = "gather"

  ## Пример с S7-1500 (UaExpert: NS4|Numeric|4207 → структура OPC_MeasurePoint).
  ## Если в БД придёт структура целиком / пусто — в UaExpert раскройте узел
  ## и возьмите NodeId дочернего поля rValueOut (тот же формат ns=...;i=...).
  nodes = [
    {name="opc_measure_point", id="ns=4;i=4207"},
  ]

###############################################################################
#                         OUTPUT: PostgreSQL                                  #
###############################################################################

[[outputs.postgresql]]
  connection = "host=timescaledb user=${POSTGRES_USER} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB} sslmode=disable"
  schema = "public"
  tags_as_foreign_keys = false
  create_templates = [
    '''CREATE TABLE IF NOT EXISTS {{ .table }} ({{ .columns }})''',
  ]

[[outputs.file]]
  files = ["stdout"]
  data_format = "influx"
